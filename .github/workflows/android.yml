name: android
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build-test.log
      - name: Surface test errors
        if: failure()
        run: |
          grep -a -E "FAILED|error:|e: .*\.kt|What went wrong|Caused by" build-test.log | head -20 | cut -c1-500 | while IFS= read -r l; do echo "::error::$l"; done; true
      - name: Lint
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace 2>&1 | tee build-lint.log
      - name: Surface lint errors
        if: failure()
        run: |
          grep -a -E "Error|error:|e: .*\.kt|What went wrong|Caused by" build-lint.log | head -20 | cut -c1-500 | while IFS= read -r l; do echo "::error::$l"; done; true
      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build-assemble.log
      - name: Assemble release APK (unsigned)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build-assemble-release.log
      - name: Surface assemble errors
        if: failure()
        run: |
          grep -a -E "FAILED|error:|e: .*\.kt|What went wrong|Caused by|AAPT|Unresolved reference" build-assemble*.log | head -30 | cut -c1-500 | while IFS= read -r l; do echo "::error::$l"; done; true
      - uses: actions/upload-artifact@v4
        with: { name: betondz-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: betondz-release-apk, path: app/build/outputs/apk/release/*.apk }
      - name: Read app version
        run: |
          VER=$(grep -hoP 'versionName\s*=?\s*[\x27\x22]\K[0-9.]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          CODE=$(grep -hoP 'versionCode\s*=?\s*\K[0-9]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "APP_VERSION=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"
      - name: Write release notes
        run: |
          {
            echo "# BetonDZ v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"; echo ""
            echo "- Version: ${APP_VERSION}+${APP_CODE}"; echo "- Commit: ${GITHUB_SHA}"
            echo "- DZ 2026 OpenPencil UX pass (DZ theme, nav icons, radio a11y)."
            echo "- Debug APK is installable; release APK is unsigned (test only)."; echo ""
            echo "## Files"; find app/build/outputs/apk -name '*.apk' -printf '- %f (%s bytes)\n'
          } > release-notes.md
          cat release-notes.md
      - name: Publish APKs to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: BetonDZ v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          bodyFile: release-notes.md
          artifacts: "app/build/outputs/apk/debug/*.apk,app/build/outputs/apk/release/*.apk"
